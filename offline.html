<!doctype html>
<html lang="fr">
<head>

<title>AS Bon Sauveur — Hors connexion</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#13213a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:32px;box-shadow:0 18px 50px rgba(19,33,58,.12);text-align:center}.logo{width:108px;height:108px;object-fit:contain}.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#0757c9;margin-top:14px}h1{font-size:30px;line-height:1.1;margin:10px 0 12px}p{line-height:1.55;color:#52627b;margin:0 0 24px}button{border:0;border-radius:14px;background:#0757c9;color:#fff;font-weight:800;padding:13px 20px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="assets/logo-as.png" alt="Association Sportive du Bon Sauveur">
<div class="kicker">ASSOCIATION SPORTIVE DU BON SAUVEUR</div>
<h1>Connexion indisponible</h1>
<p>L’application a besoin d’Internet pour charger les informations à jour et les espaces sécurisés. Vérifiez votre connexion puis réessayez.</p>
<button type="button" onclick="location.reload()">Réessayer</button>
</main>
